name: Research batch (queued experiments)

# Runs the commands in .github/run-requests/batch.sh against the cached Dukascopy data
# and commits everything written under backtests/ back to main.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/run-requests/batch.sh"

permissions:
  contents: write

concurrency:
  group: research-batch
  cancel-in-progress: false

env:
  FROM_YEAR: "2015"
  TO_DATE: "2026-11-01"

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python package
        run: pip install -e ".[dev]"
      - name: Tests must pass before any experiment
        run: pytest -q
      - name: Restore raw data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: dukascopy-eurusd-m1-bidask-${{ env.FROM_YEAR }}-${{ env.TO_DATE }}-v1
          restore-keys: dukascopy-eurusd-m1-bidask-
      - name: Download any missing raw data
        run: bash scripts/download_dukascopy.sh
      - name: Ingest
        run: python scripts/ingest_dukascopy.py --dir data/raw
      - name: Run queued batch
        run: bash .github/run-requests/batch.sh
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Batch outputs from workflow run ${{ github.run_id }}"
          git pull --rebase origin main
          git push origin HEAD:main
