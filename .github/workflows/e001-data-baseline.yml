name: E001 data ingest and session-direction baseline

# Downloads Dukascopy EUR/USD 1-minute bid and ask data, builds the canonical dataset,
# runs E001 on the dev and val blocks ONLY (OOS stays locked), and commits the raw
# outputs back to the repo. Interpretation and knowledge updates happen in a research run.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/e001-data-baseline.yml"
      - ".github/run-requests/e001.txt"

permissions:
  contents: write

concurrency:
  group: e001
  cancel-in-progress: false

env:
  FROM_YEAR: "2015"
  TO_DATE: "2026-11-01"   # fixed end date so the run is reproducible

jobs:
  e001:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python package
        run: pip install -e ".[dev]"

      - name: Tests must pass before any experiment
        run: pytest -q

      - name: Restore raw data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: dukascopy-eurusd-m1-bidask-${{ env.FROM_YEAR }}-${{ env.TO_DATE }}-v1
          restore-keys: dukascopy-eurusd-m1-bidask-

      - name: Download Dukascopy EUR/USD m1 bid and ask (per year)
        run: |
          set -euo pipefail
          npm i -g dukascopy-node@1.51.1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          echo "Chrome for WAF recovery: ${CHROME:-none}"
          if [ -z "$CHROME" ]; then dukascopy-node --install-browser; fi
          mkdir -p data/raw
          end_year="${TO_DATE:0:4}"
          for year in $(seq "$FROM_YEAR" "$end_year"); do
            from="${year}-01-01"
            if [ "$year" = "$end_year" ]; then to="$TO_DATE"; else to="$((year + 1))-01-01"; fi
            for side in bid ask; do
              name="eurusd-m1-${side}-${year}"
              if [ -s "data/raw/${name}.csv" ]; then echo "cached ${name}"; continue; fi
              echo "::group::${name} (${from} -> ${to})"
              dukascopy-node -i eurusd -from "$from" -to "$to" -t m1 -p "$side" -v -f csv \
                -dir data/raw -fn "$name" -bs 10 -bp 1500 -r 5 -rp 2000 -s \
                ${CHROME:+--chrome-path "$CHROME"}
              echo "::endgroup::"
              test -s "data/raw/${name}.csv" || { echo "download failed for ${name}"; exit 1; }
              wc -l "data/raw/${name}.csv"
            done
          done
          ls -la data/raw

      - name: Ingest and data quality report
        run: python scripts/ingest_dukascopy.py --dir data/raw

      - name: Run E001 (dev + val only; OOS locked)
        run: python scripts/run_e001_baseline.py | tee backtests/validation_reports/E001_results.txt

      - name: Upload processed dataset (90-day artifact)
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-m1-parquet
          path: data/processed/eurusd_m1.parquet
          retention-days: 90

      - name: Commit raw results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/validation_reports/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "E001: raw outputs from workflow run ${{ github.run_id }} (dev+val, OOS untouched)"
          git pull --rebase origin main
          git push origin HEAD:main
